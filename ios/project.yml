# Vantaloom iOS 壳（仅操控端）—— XcodeGen 工程描述（不要手写 .pbxproj）。
#
#   brew install xcodegen
#   VANTALOOM_IOS_NODE=false xcodegen generate      # 没有节点 xcframework 时（CI 默认）
#   VANTALOOM_IOS_NODE=true  xcodegen generate      # node/VantaloomNode.xcframework 就位时
#
# 两种形态都必须能出 IPA：没有节点库时壳显示「操控端节点未打包」占位页；有节点库时
# 由 project-node.yml 追加依赖与 -DVANTALOOM_EMBEDDED_NODE 编译旗标。
# `include.enable` 吃环境变量（XcodeGen 官方特性），CI 按 xcframework 是否存在设它。
#
# 公开仓布局：本目录整份同步到 Vantaloom-app 仓的 ios/，编译后的前端在仓库根的
# web/，CI 把它 rsync 到 ios/web/ 再生成工程（sources 里的 web 是 optional）。
# 注意：公开仓同步用 robocopy /XD 排除目录名 web/Web，所以 Swift 源目录**不能叫 Web**
# （现在是 Sources/Shell + Sources/Node + Sources/App）。

name: Vantaloom

options:
  bundleIdPrefix: online.timefiles
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # 无签名构建：CI 命令行还会再传一遍 CODE_SIGNING_ALLOWED=NO 等三项；
    # 用户在 Mac 上补签名时把这几项改回 Automatic + 自己的 Team。
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

include:
  - path: project-node.yml
    enable: ${VANTALOOM_IOS_NODE}

targets:
  Vantaloom:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # 编译后的 Next.js 静态导出（index.html + _next/...）。以「文件夹引用」
      # 整份拷进 .app/web/，操控端节点从这里原地提供页面（只读即可）。
      # 私仓里这个目录不存在（前端在 apps/vantaloom/out），所以 optional。
      - path: web
        type: folder
        buildPhase: resources
        optional: true
    # 刻意不写 `info:`——那会让 XcodeGen **生成**并覆盖 Info.plist。手写的
    # Info.plist（带注释说明哪些后台模式刻意没开）经下面的 INFOPLIST_FILE 接入。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.timefiles.vantaloom
        PRODUCT_NAME: Vantaloom
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # 没有 AppIcon 资源目录（脚手架阶段）；上 TestFlight 前必须补 1024x1024 图标。
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: "NO"
        OTHER_SWIFT_FLAGS: "$(inherited)"
        OTHER_LDFLAGS: "$(inherited)"
    scheme:
      testTargets: []
      configVariants: []
